name: torrentinel-integrated

services:
  torrentinel:
    image: "bah0/torrentinel:v0.5.0-integrated.3"
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: "0.5.0-integrated.3"
        VCS_REF: "torrentinel_integrated"
    container_name: torrentinel-integrated
    restart: unless-stopped
    shm_size: 512m
    ports:
      - "${TORRENTINEL_PORT:-18080}:8080"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:18080}"
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-60}"
      POLL_STARTUP_DELAY_SECONDS: "${POLL_STARTUP_DELAY_SECONDS:-20}"
      TRACKER_REQUEST_TIMEOUT_MS: "${TRACKER_REQUEST_TIMEOUT_MS:-30000}"
      BROWSER_TIMEOUT_MS: "${BROWSER_TIMEOUT_MS:-120000}"
      BROWSER_HEADLESS: "${BROWSER_HEADLESS:-false}"
      BROWSER_CHANNEL: "${BROWSER_CHANNEL:-auto}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    volumes:
      - torrentinel_app:/var/lib/torrentinel
      - torrentinel_db:/data

volumes:
  torrentinel_app:
    name: torrentinel_integrated_app
  torrentinel_db:
    name: torrentinel_integrated_db
